limitations: >-
  Only the d = 3 case is the submission target; the full problem remains open.
  f_D and its numerical lower bound are not formalized here. The novelty search
  did not establish priority, and no new or first-proof claim is made. Witnesses,
  separating examples and statement equivalence reduce semantic risk but do not
  replace mathematical review. Local Comparator on macOS uses no sandbox;
  sandboxed Palomar preflight and publication remain release steps for the manager.

