version: "v0.4"

project:
  name: "FKS Problem 2 in dimension three"
  description: >-
    A Lean-checked proof of the d = 3 case of FKS Problem 2: for every simple graph G on
    seven vertices, G or its complement has an injective placement in Euclidean three-space
    under which every edge has length 1. Non-edges are unconstrained and may also have
    length 1. The full question, for graphs on 2d + 1 vertices in dimension d, is stated
    and marked open. In the notation of Alon and Kupavskii, the proved case gives
    f_D(7) ≤ 3; together with the published lower bound it implies f_D(7) = 3. The formal
    target is the seven-vertex disjunction, not a definition or equality for f_D.
    The research audience is discrete geometers and extremal graph theorists studying
    unit-distance representations, graph dimension and distance Ramsey questions.
  authors: ["Dishant Shah"]
  responsible_maintainers: ["Dishant Shah"]
  license: "Apache-2.0"

classification:
  arxiv: ["math.CO", "math.MG"]
  msc2020: ["05C62", "52C10"]

sources:
  - title: "Embedding graphs in Euclidean space"
    authors: ["Nóra Frankl", "Andrey Kupavskii", "Konrad J. Swanepoel"]
    id: "https://arxiv.org/abs/1802.03092"
    type: "paper"
    location: >-
      J. Combin. Theory Ser. A 171 (2020), 105146; §5, Problem 2;
      Theorem 4 for the bounds on f_D(s)
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The source of the open question, not a published proof of its d = 3 case.
      This development proves that case using the pinned GraphDimension library.
      No claim of a new or first mathematical proof is made.
  - title: "Two notions of unit distance graphs"
    authors: ["Noga Alon", "Andrey Kupavskii"]
    id: "https://arxiv.org/abs/1306.3916"
    type: "paper"
    location: "J. Combin. Theory Ser. A 125 (2014), 1–17; §3, Additional Problems"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Defines f_D(s) as the least dimension in which every graph on s vertices or its
      complement is a distance graph. The faithful quantity f_FD is different: it also
      constrains non-edges. This project uses the non-faithful notion.

related_formalizations:
  - id: "https://github.com/Dishah3241/GraphDimension/tree/9acc3a712d477b79c3a699c160b20726309eb3c6"
    relationship: "builds-on"
    note: >-
      The proof lives in GraphDimension.Extremal.SevenVertices, declaration
      SimpleGraph.unitDistEmbeddable_three_or_compl_fin_seven. This repository supplies
      the frozen statements, their equivalence, fidelity companions and Palomar entry point.
      The statement was authored here, not inherited from formal-conjectures.

status:
  scope: >-
    questionAt3: every simple graph on Fin 7 or its complement has a unit-distance
    representation in EuclideanSpace R (Fin 3). The full FKS Problem 2 remains open
    and is represented by Prop definitions, not admitted theorems. The elementary
    d = 0 and d = 1 instances and all fidelity companions are also proved.
    The sole deliberate sorry is the advertised hole in Challenge.lean, excluded below.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "FKSProblem2.Palomar.target"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

fidelity:
  divergences: >-
    The submission specializes the source's open question to d = 3 and does not claim
    to settle it for all d. Fin 7 represents every seven-vertex simple graph up to
    relabelling, with complement on the same vertex set, injective placements and
    Euclidean L2 distance. The general frozen StatementA.question quantifies over all
    natural d, adding the trivial one-vertex d = 0 case to the positive-dimensional
    reading. StatementB quantifies over positive dimensions and places the existential
    outside the disjunction; Stage1.Equivalence proves the formulations equivalent,
    including questionAt3_iff. The inline Palomar claim agrees definitionally with A.
    The numerical interpretation f_D(7) = 3 uses the published lower bound; that equality
    and lower bound are not part of the formal target.

